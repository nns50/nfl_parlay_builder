# markets.conf — the polled-market configuration (PORT_PLAN decision (c), resolved 2026-08-08).
# Read by poll_scheduler.py / odds_api.sh (M2). KEY=VALUE, comma-separated lists, '#' comments.
# Cost model: credits = markets × regions per request; props bill PER EVENT.

# ── The Odds API sport keys (both verified active 2026-08-08) ─────────────────
SPORT_KEY_REG=americanfootball_nfl
SPORT_KEY_PRE=americanfootball_nfl_preseason

REGIONS=us

# ── Featured board (bulk /odds — one call covers every event; 3 credits/call) ─
FEATURED=h2h,spreads,totals

# ── Default per-event prop set: the "core 8" (≈8 credits/event/poll) ─────────
PROPS_CORE=player_pass_yds,player_pass_tds,player_pass_interceptions,player_rush_yds,player_rush_attempts,player_receptions,player_reception_yds,player_anytime_td

# ── Opt-in tiers — never polled by default (thin books / settle-fragile) ─────
PROPS_OPTIN_KICKING=player_field_goals,player_kicking_points,player_pats
PROPS_OPTIN_DEFENSE=player_sacks,player_solo_tackles,player_tackles_assists,player_defensive_interceptions
PROPS_OPTIN_LONGEST=player_pass_longest_completion,player_reception_longest,player_rush_longest
# Alternate (_alternate) markets are pulled per shortlisted leg only, never swept.

# ── Poll cadence phases, per event, relative to ITS kickoff ──────────────────
# Format: <T-minus-start-minutes>:<interval-minutes>, ...  (0 interval = single
# final poll at that offset — the close snapshot). Preseason: FEATURED only.
CADENCE_FEATURED=4320:480,1440:360,120:15,5:0
CADENCE_PROPS=4320:1440,1440:360,120:30,5:0

# ── Quota guards (ported doctrine) ───────────────────────────────────────────
CREDIT_FLOOR_RICH=5000
CREDIT_FLOOR_STOP=20
